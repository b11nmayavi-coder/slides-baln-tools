<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slides</title>
  <meta name="description" content="A minimal slide editor where the AI writes performant code-driven backgrounds and animations." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111318'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%237c9cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff7ac6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=Space+Grotesk:wght@300..700&family=Manrope:wght@300..800&family=DM+Sans:ital,wght@0,300..900;1,300..900&family=Sora:wght@300..800&family=Outfit:wght@300..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Fraunces:ital,wght@0,300..900;1,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400..700&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" id="deckMenuBtn" title="Decks & file">
        <span class="brand-mark"></span>
      </button>
      <input id="deckTitle" class="deck-title" spellcheck="false" aria-label="Deck title" />
      <span id="saveState" class="save-state"></span>
      <div class="spacer"></div>
      <button class="btn ghost icon-only" id="toggleFilmstrip" title="Toggle slides panel"></button>
      <button class="btn ghost icon-only" id="toggleAssistant" title="Toggle assistant (Ctrl+/)"></button>
      <div class="split">
        <button class="btn primary" id="presentBtn" title="Present (Ctrl+Enter)"></button>
        <button class="btn primary split-caret" id="presentMenuBtn" title="Present options"></button>
      </div>
    </header>

    <div class="toolbar" id="toolbar" role="toolbar"></div>

    <main class="workspace" id="workspace">
      <aside class="filmstrip" id="filmstrip" aria-label="Slides"></aside>
      <section class="canvas-area">
        <div class="stage-wrap" id="stageWrap">
          <div class="stage-frame" id="stageFrame"></div>
        </div>
        <div class="notes">
          <textarea id="notes" placeholder="Speaker notes" rows="2"></textarea>
        </div>
      </section>
      <div class="resizer" id="assistantResizer" title="Drag to resize"></div>
      <aside class="assistant" id="assistant" aria-label="Assistant"></aside>
    </main>
  </div>
  <div id="present" hidden></div>
  <div id="print" aria-hidden="true"></div>
  <input type="file" id="filePicker" hidden />
  <script type="module" src="js/main.js"></script>
</body>
</html>
